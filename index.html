<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5ff;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: #4f46e5;
            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website 🚀</h1>
        <p>यह मेरी पहली वेबसाइट है!</p>
    </header>

    <div class="card">
        <h2>नमस्ते 👋</h2>
        <p>मैं धीरे-धीरे Web Development सीख रहा हूँ।</p>
        <button>Click Me</button>
    </div>

</body>
</html>
