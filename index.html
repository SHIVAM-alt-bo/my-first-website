<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Text Generator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
}

header{
    background:#4f46e5;
    color:white;
    text-align:center;
    padding:40px 15px;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:15px;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px #ddd;
}

input, textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    font-size:16px;
}

#output{
    margin-top:20px;
    padding:15px;
    background:#f1f3f9;
    border-radius:8px;
    min-height:80px;
}
</style>
</head>

<body>

<header>
<h1>🤖 Free AI Text Generator</h1>
<p>Topic लिखो और अपना text तैयार करो</p>
</header>

<div class="container">

<div class="box">

<h2>✍️ Text Generator</h2>

<input id="topic" placeholder="जैसे: AI के फायदे">

<button onclick="generateText()">Generate</button>

<div id="output">
यहाँ आपका text दिखाई देगा...
</div>

<button onclick="copyText()">📋 Copy</button>

</div>

</div>

<script>

function generateText(){

let topic = document.getElementById("topic").value;

if(topic.trim() === ""){
    document.getElementById("output").innerText =
    "पहले कोई topic लिखें।";
    return;
}

let text =
"यह " + topic + " के बारे में एक छोटा लेख है। " +
topic + " आज के समय में एक महत्वपूर्ण विषय है। " +
"इसके कई फायदे और उपयोग हैं। " +
"हमें इसके बारे में सही जानकारी प्राप्त करके इसका समझदारी से उपयोग करना चाहिए।";

document.getElementById("output").innerText = text;

}

function copyText(){

let text = document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("Text copied! ✅");

}

</script>

</body>
</html>
